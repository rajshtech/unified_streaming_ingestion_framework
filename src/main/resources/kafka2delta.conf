  "source":{
    "source_type":"kafka",
    "kafka_payload_format": "json", # default is avro format
    "json_schema_inference_type": "infer_as_struct",
    # The other options are "infer_as_value" - infers json value as string, "infer_as_struct" - user need to provide the schema, "infer_schema_dynamically" - This infers schema dynmimcally from json data in foreachBatch but there downsides in performance and latency.
#     "infer_as_struct":   "{\"type\":\"struct\",\"fields\":[{\"name\":\"ordertime\",\"type\":\"timestamp\",\"nullable\":false},{\"name\":\"orderid\",\"type\":\"integer\",\"nullable\":false},{\"name\":\"itemid\",\"type\":\"string\",\"nullable\":false},{\"name\":\"address\",\"type\":{\"type\":\"struct\",\"fields\":[{\"name\":\"city\",\"type\":\"string\",\"nullable\":false},{\"name\":\"state\",\"type\":\"string\",\"nullable\":false},{\"name\":\"zipcode\",\"type\":\"integer\",\"nullable\":false}]},\"nullable\":true}]}",
    "infer_as_struct": "{\"type\":\"struct\",\"fields\":[{\"name\":\"article_id\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"article_version_id\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"client_code\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"eecode\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"id\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"module_id\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"origin\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"proc_city\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"user_device\",\"type\":\"string\",\"nullable\":true,\"metadata\":{}},{\"name\":\"view_timestamp\",\"type\":\"long\",\"nullable\":true,\"metadata\":{}}]}"
    "groupId_prefix":"dtest",
    "group_id":"user_test",
    "kafka_security_protocol":"SASL_PLAINTEXT",
    "kafka_ssl_enabled":"true",
    "max_offsets_per_trigger":"100",
    "max_partitions_fetchBytes":"15728648",
    "sasl_mechanism":"PLAIN",
    "new_topic_offset": "latest",
    "topics": [
      "user_activity"
    ],
    "read_options": {
      "mode": "DROPMALFORMED"
    }
  },
  "target":{
    "sink_type":"delta",
    "auto_offset_toggle": "true",
    "checkpoint_path":"/IdeaProjects/unified_streaming_ingestion_framework/target_lo/checkpoint9",
    "format":"delta",
    "minPartitions":96,
    "minPartitions_enabled":"true",
    "partitionBy":"topic;batchid",
    "target_path":"/IdeaProjects/unified_streaming_ingestion_framework/target_lo/data",
    "trigger_seconds":"10",
    "trigger_once":"true",
    "write_operation_type":"insert",
    "writeOptions": {
    },
    #"mergeMatchFields":["batchid"]
  },
  "transform": {
    "type": "chain",
    "chain": [
        {
        "type": "select",
        "selectExpr": [
           "recordValue.*",
           "topic as topic",
           "timestamp as timestamp"
           #"date_format(timestamp,'yyyyMMdd') as batchid"
          ]
        },
        {
        "type": "custom",
        "custom_transform": {
       #  "__source_ts_ms": "date_format(from_unixtime(__source_ts_ms/1000), 'yyyy-MM-dd HH:mm:ss') as __source_ts_ms",
       #  "__ts_ms": "date_format(from_unixtime(__source_ts_ms/1000), 'yyyy-MM-dd HH:mm:ss') as __ts_ms",
         "batchid": "date_format(timestamp,'yyyyMMdd') as batchid",
          #"sentDate": "to_utc_timestamp(sentDate, 'UTC') as sentDate"
         }
        }
    ]

